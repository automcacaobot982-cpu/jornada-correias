<!DOCTYPE html>
<!--
============================================================================
  PORTAL JORNADA DAS CORREIAS  -  Belt Correias Especiais
  Painel gamificado (pixel art medieval) para o endereçamento de estoque.
  Lê os dados AO VIVO de 8 planilhas Google Sheets (somente leitura).

  >>> COMO USAR (leia com calma):
  1) Cada planilha precisa estar PÚBLICA para leitura. No Google Sheets:
     Arquivo > Compartilhar > Publicar na Web  (ou "Qualquer pessoa com o link
     pode VER"). Sem isso o portal não consegue ler os dados.
  2) Toda a parte que você edita à mão está no bloco "CONFIGURAÇÃO" logo
     abaixo (senhas, penalidades, faltas, meta do mês). Está tudo comentado.
  3) Para instalar como app no Android: hospede este arquivo (ex.: GitHub
     Pages, HTTPS), abra no Chrome do celular e use "Adicionar à tela inicial".
============================================================================
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120c1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jornada das Correias">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23120c1f'/%3E%3Crect x='3' y='2' width='10' height='2' fill='%23ffd700'/%3E%3Crect x='2' y='4' width='12' height='7' fill='%238b6508'/%3E%3Crect x='6' y='6' width='4' height='3' fill='%23ffd700'/%3E%3Crect x='5' y='11' width='6' height='3' fill='%23b8860b'/%3E%3C/svg%3E">
<title>Jornada das Correias — Portal e Painel</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&family=Cinzel:wght@600;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --fundo:#120c1f; --painel:#181124; --painel2:#211735; --painel3:#100a19;
      --borda:#5c4033; --borda2:#3b284c; --ouro:#ffd700; --ouro2:#b8860b; --ouro3:#8b6508;
      --creme:#e2d1a6; --creme2:#f3e5ab; --laranja:#ffaa00; --roxo:#a855f7; --roxo2:#c084fc;
      --verde:#22c55e; --vermelho:#ef4444;
    }

    body {
        font-family: 'MedievalSharp', Georgia, serif;
        background-color: var(--fundo);
        color: var(--creme);
        padding: 12px;
        padding-top: max(12px, env(safe-area-inset-top));
        background-image: radial-gradient(circle at 50% 15%, #2a1b40 0%, #120c1f 90%);
        min-height: 100vh;
    }

    .main-wrapper { width: 100%; max-width: 480px; margin: 0 auto; }

    /* ---------- CABEÇALHO ---------- */
    .header {
        text-align: center; border: 3px solid var(--ouro2); background: #1c132b;
        padding: 14px 8px; margin-bottom: 12px; border-radius: 6px; position: relative;
        box-shadow: 0 0 10px rgba(184,134,11,0.4);
    }
    .header h1 {
        font-family: 'Cinzel', serif; font-size: 15pt; color: var(--creme2);
        text-transform: uppercase; letter-spacing: 1px;
        text-shadow: 2px 2px 0px #000, 0 0 8px #ffaa00; margin-bottom: 4px;
    }
    .header .subtitle { font-family:'Press Start 2P',cursive; font-size:5pt; color:var(--laranja); letter-spacing:.5px; line-height:1.4; }

    .btn-logout {
        position: absolute; top: 12px; right: 12px; background: var(--vermelho);
        border: 1px solid #fca5a5; color: #fff; padding: 5px 8px; border-radius: 4px;
        font-family: 'Press Start 2P', cursive; font-size: 4.5pt; cursor: pointer;
    }

    /* ---------- PAINEL GENÉRICO ---------- */
    .panel {
        background: var(--painel); border: 2px solid var(--borda); border-radius: 6px;
        padding: 12px; margin-bottom: 12px; box-shadow: inset 0 0 8px #000;
    }
    .panel-title {
        font-family: 'Cinzel', serif; font-size: 11pt; color: var(--ouro);
        border-bottom: 2px solid var(--ouro3); padding-bottom: 4px; margin-bottom: 12px;
        text-transform: uppercase; display: flex; align-items: center; gap:6px; justify-content: space-between;
    }
    .panel-sub { font-size: 7.5pt; color: var(--roxo); margin: -6px 0 10px; }
    .hr { border:none; border-top:1px solid var(--borda2); margin: 10px 0; }

    /* ---------- TELA / SEÇÕES ---------- */
    .view-section { display: none; width: 100%; }
    .view-section.active { display: block; }

    /* ---------- LOGIN ---------- */
    .char-select-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .char-option {
        background: var(--painel2); border: 2px solid var(--borda2); border-radius: 6px;
        padding: 8px 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all .2s;
    }
    .char-option.master-option { background: #2e1065; border-color: var(--roxo); }
    .char-option:hover, .char-option.selected { border-color: var(--ouro); background:#2d1d49; box-shadow:0 0 8px rgba(255,215,0,.3); }
    .char-option.master-option.selected { border-color: var(--roxo2); background:#3b0764; box-shadow:0 0 10px rgba(192,132,252,.5); }
    .pixel-avatar { width: 38px; height: 38px; border: 2px solid var(--ouro3); image-rendering: pixelated; flex-shrink:0; border-radius:4px; }
    .char-option.selected .pixel-avatar { border-color: var(--ouro); }
    .char-name { font-size: 9pt; color: var(--creme2); font-weight: bold; flex-grow: 1; }
    .master-badge { font-family:'Press Start 2P',cursive; font-size:4pt; background:#7e22ce; color:var(--creme2); padding:2px 4px; border-radius:3px; border:1px solid var(--roxo2); }
    .radio-pixel { width:14px; height:14px; border:2px solid var(--ouro3); background:#000; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .char-option.selected .radio-pixel::after { content:''; width:6px; height:6px; background: var(--ouro); }

    .input-group { margin: 10px 0 12px; }
    .input-label { font-family:'Press Start 2P',cursive; font-size:5.5pt; color:var(--laranja); margin-bottom:6px; display:block; }
    .pixel-input {
        width: 100%; background:#000; border:2px solid var(--ouro3); border-radius:4px; padding:10px;
        color: var(--ouro); font-family:'Courier New',monospace; font-size:11pt; outline:none; box-shadow: inset 0 0 5px rgba(0,0,0,.8);
    }
    .pixel-input:focus { border-color: var(--ouro); box-shadow:0 0 6px rgba(255,215,0,.4); }
    .error-msg { font-family:'Press Start 2P',cursive; font-size:5pt; color:var(--vermelho); margin-bottom:10px; text-align:center; display:none; }

    .btn-action {
        width: 100%; background: linear-gradient(180deg, var(--ouro2) 0%, var(--ouro3) 100%);
        border: 2px solid var(--ouro); border-radius:4px; padding:12px; color:#fff;
        font-family:'Press Start 2P',cursive; font-size:7pt; text-shadow:1px 1px 0px #000; cursor:pointer;
        text-transform:uppercase; box-shadow:0 4px 0 var(--borda2); transition: transform .1s;
    }
    .btn-action:active { transform: translateY(2px); box-shadow:0 2px 0 var(--borda2); }

    .footer-note { text-align:center; font-size:6.5pt; color:#8b7d6b; margin-top:10px; font-style:italic; }

    /* ---------- TOOLBAR (mês + sync) ---------- */
    .toolbar { display:flex; gap:8px; align-items:center; }
    .month-select {
        flex:1; background:#000; border:2px solid var(--ouro3); color:var(--ouro);
        font-family:'MedievalSharp',serif; font-size:11pt; padding:9px; border-radius:4px; outline:none;
    }
    .btn-sync {
        background:#2e1065; border:2px solid var(--roxo); color:#fff; border-radius:4px;
        padding:9px 11px; font-family:'Press Start 2P',cursive; font-size:6pt; cursor:pointer; white-space:nowrap;
    }
    .btn-sync:active { transform: translateY(1px); }

    /* ---------- STAT GRID ---------- */
    .stat-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:8px; }
    .stat-box { background: var(--painel2); border:1px solid var(--borda2); padding:8px; border-radius:4px; text-align:center; }
    .stat-value { font-family:'Press Start 2P',cursive; font-size:8.5pt; color:var(--ouro); margin-top:5px; line-height:1.3; }
    .stat-label { font-size:7.5pt; color:var(--roxo); }

    /* ---------- META ---------- */
    .meta-wrap { background: var(--painel3); border:1px solid var(--borda2); border-radius:5px; padding:10px; }
    .meta-line { display:flex; justify-content:space-between; font-size:8.5pt; margin-bottom:6px; color: var(--creme2); }
    .bar-bg { width:100%; height:14px; background:#000; border:1px solid var(--ouro3); border-radius:7px; overflow:hidden; }
    .bar-fill { height:100%; background: linear-gradient(90deg, var(--ouro2), var(--ouro)); width:0%; transition: width 1s; }
    .bar-fill.roxo { background: linear-gradient(90deg, #6d28d9, var(--roxo2)); }

    /* ---------- HALL DA FAMA ---------- */
    .leaderboard { width:100%; border-collapse:collapse; }
    .leaderboard th { font-family:'Press Start 2P',cursive; font-size:4.5pt; background:#2e1065; color:var(--creme); padding:8px 5px; text-align:left; border:1px solid #4c1d95; }
    .leaderboard td { font-size:8.5pt; padding:8px 5px; border:1px solid var(--borda2); background:#1e1b4b; vertical-align:middle; }
    .lider-row td { background:#3b284c; font-weight:bold; color:var(--ouro); }
    .pts-cell { font-family:'Press Start 2P',cursive; font-size:5pt; }
    .lendario-badge { font-family:'Press Start 2P',cursive; font-size:3.6pt; background:#b91c1c; color:var(--creme2); padding:2px 3px; border-radius:3px; border:1px solid #f87171; margin-left:3px; white-space:nowrap; }
    .guardiao-badge { font-family:'Press Start 2P',cursive; font-size:3.6pt; background:#065f46; color:#d1fae5; padding:2px 3px; border-radius:3px; border:1px solid #34d399; margin-left:3px; white-space:nowrap; }

    .classe-tag { font-family:'Press Start 2P',cursive; font-size:4.2pt; padding:2px 4px; border-radius:3px; border:1px solid #000; }
    .cl-Bronze{background:#7c3f12;color:#fde3c8;} .cl-Prata{background:#6b7280;color:#f8fafc;}
    .cl-Ouro{background:#a16207;color:#fff7cf;} .cl-Diamante{background:#0e7490;color:#cffafe;} .cl-Rubi{background:#991b1b;color:#fee2e2;}

    /* ---------- BANNER GUARDIÃO ---------- */
    .guardiao-banner {
        background: radial-gradient(circle, #065f46 0%, #022c22 100%); border:2px dashed #34d399;
        border-radius:6px; padding:10px; text-align:center; margin-bottom:12px;
    }
    .guardiao-banner .t { font-family:'Press Start 2P',cursive; font-size:5.5pt; color:#6ee7b7; margin-bottom:6px; }
    .guardiao-banner .n { font-size:12pt; color:#fff; font-weight:bold; }
    .guardiao-banner .d { font-size:7.5pt; color:#a7f3d0; margin-top:4px; }

    /* ---------- HERO (operador) ---------- */
    .hero-profile { display:flex; align-items:center; gap:12px; margin-bottom:12px; background:#2d1d49; padding:10px; border:2px solid var(--roxo); border-radius:6px; }
    .hero-info { flex-grow:1; min-width:0; }
    .hero-name { font-family:'Cinzel',serif; font-size:13pt; color:#fff; font-weight:bold; line-height:1.1; }
    .hero-class { font-size:8.5pt; color:var(--ouro); margin:3px 0; }
    .hero-xp { font-family:'Press Start 2P',cursive; font-size:5pt; color:var(--roxo2); margin-top:5px; }

    /* ---------- EXTRATO / BREAKDOWN ---------- */
    .bd-table { width:100%; border-collapse:collapse; font-size:8.5pt; }
    .bd-table td { padding:6px 6px; border-bottom:1px solid var(--borda2); }
    .bd-table td.q { text-align:center; color:var(--roxo2); width:58px; font-size:8pt; }
    .bd-table td.x { text-align:right; font-family:'Press Start 2P',cursive; font-size:5pt; color:var(--ouro); width:70px; }
    .bd-table tr.neg td.x { color:#fca5a5; }
    .bd-table tr.sub td { border-top:2px solid var(--ouro3); font-weight:bold; color:var(--creme2); }
    .bd-table tr.tot td { border-top:2px solid var(--ouro); }
    .bd-table tr.tot td.x { font-size:6.5pt; color:var(--ouro); }
    .bd-table tr.bonus td.x { color:#6ee7b7; }

    /* ---------- OPERADOR CARD (coordenador) ---------- */
    details.op-card { background: var(--painel3); border:1px solid var(--borda2); border-radius:5px; margin-bottom:8px; overflow:hidden; }
    details.op-card summary { list-style:none; cursor:pointer; padding:9px 10px; display:flex; align-items:center; gap:9px; }
    details.op-card summary::-webkit-details-marker { display:none; }
    .op-card .mini-av { width:26px; height:26px; border:1px solid var(--ouro3); border-radius:3px; image-rendering:pixelated; flex-shrink:0; }
    .op-card .op-nm { flex-grow:1; font-size:9pt; color:var(--creme2); font-weight:bold; min-width:0; }
    .op-card .op-pt { font-family:'Press Start 2P',cursive; font-size:5.5pt; color:var(--ouro); }
    .op-card .op-body { padding: 2px 10px 10px; }
    .op-card .chev { color:var(--roxo2); font-size:9pt; }
    details[open].op-card .chev { transform: rotate(90deg); }

    /* ---------- CHART (pixel bars) ---------- */
    .chart { display:flex; align-items:flex-end; gap:3px; height:110px; padding:4px; background:#000; border:1px solid var(--ouro3); border-radius:4px; }
    .chart .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
    .chart .bar { width:100%; background: linear-gradient(180deg, var(--ouro), var(--ouro2)); border:1px solid #000; border-bottom:none; image-rendering:pixelated; min-height:2px; }
    .chart .bar.roxo { background: linear-gradient(180deg, var(--roxo2), #6d28d9); }
    .chart-x { display:flex; gap:3px; padding:2px 4px 0; }
    .chart-x span { flex:1; text-align:center; font-size:5pt; color:#8b7d6b; overflow:hidden; }
    .chart-val { font-size:5pt; color:var(--ouro); margin-bottom:2px; font-family:'Press Start 2P',cursive; }

    /* ---------- ÁREA / PROJETOS ---------- */
    .area-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:6px; margin-top:6px; }
    .area-box { background:var(--painel2); border:1px solid var(--borda2); border-radius:4px; padding:6px 2px; text-align:center; }
    .area-box .a-l { font-size:6.5pt; color:var(--roxo); }
    .area-box .a-v { font-family:'Press Start 2P',cursive; font-size:6pt; color:var(--ouro); margin-top:3px; }
    .projeto { margin-bottom:10px; }
    .projeto .p-h { display:flex; justify-content:space-between; font-size:8.5pt; margin-bottom:4px; color:var(--creme2); }

    /* ---------- POWERUP / MISSÕES ---------- */
    .powerup-box { background: radial-gradient(circle, #4c1d95 0%, #1e1b4b 100%); border:2px dashed var(--roxo2); padding:12px; text-align:center; border-radius:6px; }
    .powerup-title { font-family:'Press Start 2P',cursive; font-size:5pt; color:var(--roxo2); margin-bottom:6px; }
    .powerup-name { font-size:13pt; color:#fff; font-weight:bold; }
    .powerup-eff { font-size:8pt; color:#ddd6fe; margin-top:5px; }
    .powerup-cond { font-size:6.8pt; color:#8b7d6b; margin-top:8px; font-style:italic; }
    .mission-item { background:var(--painel3); border:1px solid var(--borda2); padding:9px 10px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:8.5pt; }
    .mission-item input { width:18px; height:18px; accent-color:var(--roxo); cursor:pointer; flex-shrink:0; }

    .info-list { font-size:8pt; line-height:1.6; color:var(--creme); }
    .info-list b { color: var(--ouro); }
    .xp-chip { display:inline-block; font-family:'Press Start 2P',cursive; font-size:4.5pt; background:#1e1b4b; border:1px solid var(--borda2); color:var(--ouro); padding:2px 4px; border-radius:3px; }
    .xp-chip.neg { color:#fca5a5; }

    /* ---------- LOADING ---------- */
    #loading { position:fixed; inset:0; background:var(--fundo); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2000; text-align:center; padding:20px; }
    #loading .lt { font-family:'Cinzel',serif; font-size:16pt; color:var(--ouro); text-shadow:0 0 8px #ffaa00; margin-bottom:14px; }
    #loading .ls { font-family:'Press Start 2P',cursive; font-size:6pt; color:var(--laranja); line-height:1.6; }
    .spinner { width:40px; height:40px; margin:18px auto; border:4px solid var(--borda2); border-top-color:var(--ouro); border-radius:50%; animation: spin 1s linear infinite; image-rendering:pixelated; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- BANNER ERRO ---------- */
    .banner-erro { display:none; background:#3f1d1d; border:2px solid var(--vermelho); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:8pt; color:#fecaca; line-height:1.5; }
    .banner-erro b { color:#fff; }
    .banner-erro ul { margin:6px 0 0 16px; }

    .tiny { font-size:7pt; color:#8b7d6b; }

    /* ---------- PRÊMIO (R$) ---------- */
    .premio-tot { text-align:center; background: radial-gradient(circle,#3b2f0a 0%,#1a1503 100%); border:2px solid var(--ouro2); border-radius:6px; padding:12px 10px; margin-bottom:10px; }
    .premio-tot .v { font-family:'Press Start 2P',cursive; font-size:11pt; color:var(--ouro); text-shadow:0 0 8px #ffaa00; }
    .premio-tot .l { font-size:7.5pt; color:var(--creme2); margin-top:6px; line-height:1.4; }
    .premio-table { width:100%; border-collapse:collapse; }
    .premio-table td { font-size:9pt; padding:8px 6px; border-bottom:1px solid var(--borda2); vertical-align:middle; }
    .premio-table td.q { text-align:center; color:var(--roxo2); font-size:7.5pt; }
    .premio-table td.r { text-align:right; font-family:'Press Start 2P',cursive; font-size:6pt; color:#6ee7b7; white-space:nowrap; }

    /* caixa "valor a receber" no painel do operador */
    .prize-box { grid-column:1 / -1; background: radial-gradient(circle,#064e3b 0%,#022c22 100%); border:2px solid #34d399; border-radius:5px; padding:10px; text-align:center; }
    .prize-box .l { font-size:7.5pt; color:#a7f3d0; }
    .prize-box .v { font-family:'Press Start 2P',cursive; font-size:10pt; color:#6ee7b7; margin-top:5px; }

    /* tabela por indicador (coordenador) */
    .ind-table { width:100%; border-collapse:collapse; }
    .ind-table th { font-family:'Press Start 2P',cursive; font-size:4pt; background:#2e1065; color:var(--creme); padding:7px 4px; text-align:left; border:1px solid #4c1d95; }
    .ind-table td { font-size:8.5pt; padding:7px 4px; border:1px solid var(--borda2); background:#1e1b4b; }
    .ind-table td.n { text-align:center; color:var(--roxo2); font-size:8pt; }
    .ind-table td.x { text-align:center; font-family:'Press Start 2P',cursive; font-size:4.5pt; color:var(--ouro); }
    .ind-table td.r { text-align:right; font-family:'Press Start 2P',cursive; font-size:4.5pt; color:#6ee7b7; white-space:nowrap; }
    .pts-xp { font-size:6.5pt; color:var(--creme2); opacity:.65; }
</style>
</head>
<body>

<!-- ===== TELA DE CARREGAMENTO ===== -->
<div id="loading">
    <div class="lt">⚔️ Jornada das Correias 🛡️</div>
    <div class="spinner"></div>
    <div class="ls" id="loading-msg">Invocando os pergaminhos da guilda...</div>
</div>

<div class="main-wrapper">

    <!-- ========================================================= -->
    <!-- TELA 1: PORTAL DE ENTRADA / LOGIN                          -->
    <!-- ========================================================= -->
    <div id="tela-login" class="view-section">
        <div class="header">
            <h1>⚔️ Jornada das Correias 🛡️</h1>
            <div class="subtitle">[ PORTAL DE ENTRADA DA GUILDA ]</div>
        </div>

        <div id="banner-erro-login" class="banner-erro"></div>

        <div class="panel">
            <div class="panel-title"><span>👤 Selecione seu Herói</span></div>
            <div class="char-select-container" id="charList"></div>
            <div class="input-group">
                <label
